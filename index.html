<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#111c36">
<title>Sistema de Gestión Empresarial</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth"></div>
<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <div class="logo"><i class="fa-solid fa-store"></i><b>Gestión Empresarial</b></div>
    <nav id="nav" aria-label="Menú principal"></nav>
    <div class="side-foot"><button class="btn out" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="top"><button class="icon" id="menuBtn" aria-label="Menú"><i class="fa-solid fa-bars"></i></button><h1 id="pageTitle">Dashboard</h1><span class="sp"></span><span class="demo" id="demoTag" hidden>MODO DEMO</span><button class="icon" id="themeBtn" aria-label="Tema"><i class="fa-solid fa-moon"></i></button><div class="user" id="userChip"></div></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<dialog id="modal"><div class="mh"><b id="mTitle"></b><button class="icon" id="mClose" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button></div><div id="mBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/core.js"></script><script src="js/modules-a.js"></script><script src="js/modules-b.js"></script><script src="js/modules-c.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
</body>
</html>
